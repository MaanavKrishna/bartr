<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bartr">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <!-- One arrow, drawn once and mirrored through the centre so the mark stays
         balanced at every size. The head is stroked as well as filled so its
         corners round off to match the shaft's caps. -->
    <g id="arrow" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5 11.5h10" stroke-width="3" fill="none" />
      <path d="M17.4 7.9 24.2 11.5 17.4 15.1Z" stroke-width="2.2" fill="#ffffff" />
    </g>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#tile)" />
  <use href="#arrow" />
  <use href="#arrow" transform="rotate(180 16 16)" />
</svg>
